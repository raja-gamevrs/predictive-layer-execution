[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ple"
version = "0.0.1"
description = "Predictive Layer Execution: speculative projection and correction research"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.7",
  "transformers>=4.51",
  "accelerate",
  "safetensors",
  "numpy",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
quant = ["bitsandbytes"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
